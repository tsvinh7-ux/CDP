[project]
name = "cdp-core"
version = "0.1.0"
description = "DMAG CDP Core: ingestion, identity resolution, traits, segmentation and activation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
kafka = ["confluent-kafka>=2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cdp_core*"]

[tool.setuptools.package-data]
cdp_core = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
